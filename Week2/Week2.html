<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 JavaScript Lab</title>
    <style>
        @font-face {
            font-family: "Slowly Move";
            src: url(fonts/Slowly\ Move.otf);
        }
        body {
            background-color: #448ac7;
        }

        #container {
            width: 100%;
            margin: 0 auto;
            text-align: center;
            background-color: #448ac7;
        }

        #output {
            font-family: "Slowly Move", sans-serif;
            color: #4400ff;
            font-size: 48px;
            width: 100px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div id="container">
    <h1>Week 2 JavaScript Lab</h1>
    <span id="message"></span>
    <hr>
    <br>
    <h2>Button Clicker</h2>
    <h3 id="output">0</h3>
    <input type="button" value="Click Me!" id="btn">
    <input type="button" value="Clear Clicks" id="btn-reset">
    </div>


    <!-- Example JavaScript code -->
    <script>
        // var name = prompt("Enter your name:");
        // var firstNumber = prompt("Enter your first number:");
        // var secondNumber = prompt("Enter your second number:");
        // var value = firstNumber * secondNumber;
        // var message = ` ${name}, 
        // \nYour first number was: ${firstNumber}. 
        // \nYour second number was: ${secondNumber}. 
        // \nYour result is ${value}`;
        // console.log(message);
        // document.getElementById("message").innerHTML = message;
        // document.getElementById("message").style.color = "green";

        // Button clicker functionality test
        var  clickerbutton = document.querySelector("#btn");
        var  clearButton = document.querySelector("#btn-reset");
        var  clickeroutput = document.querySelector("#output");

        var numberOfClicks = 0;

        clickerbutton.addEventListener("click", function() {
            numberOfClicks++;
            updateClickerDisplay();

            if (numberOfClicks == 42) {
                alert("You have clicked the button 42 times!");
            }
        });

        clearButton.addEventListener("click", function() {
            numberOfClicks = 0;
            //calling the below function to update the display of the number of clicks
            updateClickerDisplay();
        });

        function updateClickerDisplay() {
            //function to be called to update the display of the number of clicks
            clickeroutput.innerHTML = numberOfClicks;
        }


        </script>
</body>
</html>
